version: '3.8'

services:
  mysql_db:
    image: mysql:latest
    container_name: dashcash_mysql
    environment:
      MYSQL_ROOT_PASSWORD: securepassword123
      MYSQL_DATABASE: dashcashdb
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  dashcash_api:
    build: .
    container_name: dashcash_api
    ports:
      - "5099:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql_db;Database=dashcashdb;Uid=root;Pwd=securepassword123;
    depends_on:
      - mysql_db

volumes:
  mysql_data: